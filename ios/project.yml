# XcodeGen 規格：.xcodeproj 由這份產生（xcodegen generate），不要手改 .xcodeproj。
name: SessionRemote
options:
  bundleIdPrefix: com.bruuucechang
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: CXJ2S2G4JD
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SessionRemote:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    entitlements:
      path: SessionRemote.entitlements
      properties:
        # 不上架、只用 Xcode 裝到自己的手機：開發環境的推播
        aps-environment: development
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Sessions
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification]
        # 筆電服務走 Tailscale 的 http://100.x.x.x，沒有 TLS
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.bruuucechang.sessionremote
            CFBundleURLSchemes: [sessionremote]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bruuucechang.sessionremote
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
