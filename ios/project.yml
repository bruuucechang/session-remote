# XcodeGen 規格：.xcodeproj 由這份產生（xcodegen generate），不要手改 .xcodeproj。
name: SessionRemote
options:
  bundleIdPrefix: com.bruuucechang
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: CXJ2S2G4JD
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SessionRemote:
    type: application
    platform: iOS
    sources: [Sources, Resources, Shared]
    dependencies:
      - target: SessionWidgets
    entitlements:
      path: SessionRemote.entitlements
      properties:
        # 不上架、只用 Xcode 裝到自己的手機：開發環境的推播
        aps-environment: development
        # 跟小工具共用連線設定（網址與通行碼）
        com.apple.security.application-groups: [group.com.bruuucechang.sessionremote]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Sessions
        # 宣告繁中：不然手機語言是英文時，系統元件（確認框的取消、搜尋沒結果）會講英文
        CFBundleDevelopmentRegion: zh-Hant
        CFBundleLocalizations: [zh-Hant]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification]
        # 鎖定畫面與動態島的即時狀態（筆電用推播更新）
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSPhotoLibraryUsageDescription: 選照片傳給筆電上的 Claude 看
        # 筆電服務走 Tailscale 的 http://100.x.x.x，沒有 TLS
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.bruuucechang.sessionremote
            CFBundleURLSchemes: [sessionremote]
    scheme:
      testTargets: [SessionRemoteUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bruuucechang.sessionremote
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"

  # 主畫面小工具＋鎖定畫面／動態島的即時狀態，同一個 extension
  SessionWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
      - Sources/API.swift
    entitlements:
      path: SessionWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.bruuucechang.sessionremote]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Sessions
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bruuucechang.sessionremote.widgets
        TARGETED_DEVICE_FAMILY: "1"

  # 自動化 UI 測試（tools/uitest.sh）：吃假資料後端（tools/fake-backend.sh），不碰真的 session
  SessionRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: SessionRemote
    info:
      path: UITests/Info.plist
      properties:
        # 測試程式自己也要打假資料後端（重來、讀送出去的字），走 Tailscale 的 http
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bruuucechang.sessionremote.uitests
        TEST_TARGET_NAME: SessionRemote
        TARGETED_DEVICE_FAMILY: "1"
